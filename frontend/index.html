<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
    }

    #login-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #login-form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 300px;
    }

    #login-form input {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }

    #login-form button {
      padding: 0.75rem;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #login-form button:hover {
      background: #555;
    }

    #Login-Signup {
      text-align: center;
      color: #333;
      text-decoration: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #Login-Signup:hover {
      text-decoration: underline;
    }

    #chat-form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    #chat-form>input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
    }

    #chat-form>input:focus {
      outline: none;
    }

    #chat-form>button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages>li {
      padding: 0.5rem 1rem;
    }

    #messages>li:nth-child(odd) {
      background: #efefef;
    }

    #clear-logout {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    #logout{
      padding: 0.5rem 1rem;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #clear {
      padding: 0.5rem 1rem;
      background-color:antiquewhite;
      color: #555;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div id="login-screen">
    <h2>Welcome to Chat App!</h2>
    <form id="login-form" action="">
      <input id="username" type="text" placeholder="Username" />
      <input type="password" name="password" id="password" placeholder="Password" />
      <button id="login" type="submit">Signup</button>

      <a id="Login-Signup" isLoginMode="false">Login</a>
    </form>
  </div>


  <div id="chat-screen" style="display: none;">
    <div id="clear-logout">
      <button id="logout" type="button">Logout</button>
      <button id="clear">Clear</button>
    </div>
    <ul id="messages"></ul>
    <form id="chat-form" action="">
      <input id="input" autocomplete="off" /><button type="submit">Send</button>
      <button id="connection">Disconnect</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const isLogin = document.getElementById('Login-Signup').getAttribute('isLoginMode');
      if (isLogin === 'true') {
        fetch("http://localhost:3000/users/login", {
          headers: { "Content-Type": "application/json" },
          method: "POST",
          body: JSON.stringify({
            userName: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        })
          .then(res => res.json())
          .then((data) => {
            localStorage.setItem('token', data.token)
            socket.auth.token = data.token
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'block';
            socket.connect();
          })
          .catch((err) => {
            console.log("Login Failed!", err)
          })
      }
      else {
        fetch("http://localhost:3000/users/signup", {
          headers: { "Content-Type": "application/json" },
          method: "POST",
          body: JSON.stringify({
            userName: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        })
          .then(() => {
            alert("Signup Successful! Please Login.");
            // Switch to login mode automatically
            const loginSignup = document.getElementById('Login-Signup');
            loginSignup.textContent = 'Signup';
            document.getElementById('login').textContent = 'Login';
            loginSignup.setAttribute('isLoginMode', 'true');
          })
          .catch((err) => {
            console.log("Signup Failed!", err)
          })
      }

    })

    const savedtoken = localStorage.getItem('token');

    let lastTimeStamp = 0;
    let token = '';
    const socket = io({
      auth: {
        serverTimeStamp: lastTimeStamp,
        token: savedtoken
      },
      autoConnect: false,
      ackTimeout: 3000,
      retries: 3
    });

    if (savedtoken && savedtoken !== "undefined") {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'block';
      socket.connect();
    }
    else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('chat-screen').style.display = 'none';
    }

    const chatForm = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const connection = document.getElementById('connection');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        const msg = input.value

        socket.timeout(5000).emit('chat message', msg, (err) => {
          if (err) socket.emit('chat message', msg, err)
        })

        input.value = '';
      }
    })

    connection.addEventListener('click', (e) => {
      e.preventDefault();

      if (socket.connected) {
        connection.innerText = 'Connect';
        socket.disconnect();
      }
      else {
        socket.connect();
        connection.innerText = 'Disconnect';
      }
    })

    socket.on('connect', () => {
      console.log('Connected to Server!')
    })
    socket.on('disconnect', () => {
      console.log('Disconnected from Server!')
    })

    socket.on('chat message', (msg, lastTimeStamp) => {
      console.log('Recieved message', msg, 'lastTimeStamp:', lastTimeStamp)
      const item = document.createElement('li');
      item.textContent = msg
      messages.appendChild(item)
      window.scrollTo(0, document.body.scrollHeight);
      socket.auth.serverTimeStamp = lastTimeStamp;
    })

    const loginSignup = document.getElementById('Login-Signup');
    loginSignup.addEventListener('click', (e) => {
      e.preventDefault()
      const isLogin = document.getElementById('Login-Signup').getAttribute('isLoginMode');
      if (isLogin === 'false') {
        loginSignup.textContent = "Signup";
        document.getElementById('login').textContent = 'Login';
        loginSignup.setAttribute('isLoginMode', 'true');
      }
      else {
        loginSignup.textContent = 'Login';
        document.getElementById('login').textContent = 'Signup';
        loginSignup.setAttribute('isLoginMode', 'false');
      }
    })

    const logout = document.getElementById('logout');
    logout.addEventListener('click', (e) => {
      e.preventDefault();
      socket.disconnect();
      localStorage.removeItem('token');
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('messages').innerHTML = '';
    })

    document.getElementById('clear').addEventListener('click', (e)=> {
      e.preventDefault();

      messages.innerHTML = "";
    })

  </script>
</body>

</html>
